name: Container
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  build:
    name: Build and test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: false
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --only-group dev --frozen python scripts/check-release-version "$RELEASE_TAG"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
          flavor: latest=false
      - name: Build native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ha-downloads:smoke
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: BUILD_VERSION=${{ steps.metadata.outputs.version }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - name: Verify image source labels
        env:
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          docker image inspect ha-downloads:smoke --format '{{json .Config.Labels}}' |
            jq -e --arg revision "$GITHUB_SHA" --arg version "$EXPECTED_VERSION" \
              --arg source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" '
                .["org.opencontainers.image.revision"] == $revision
                and .["org.opencontainers.image.source"] == $source
                and ($version == "" or .["org.opencontainers.image.version"] == $version)
              '
      - name: Test packaged services and missing-configuration boundary
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: scripts/container-smoke.sh ha-downloads:smoke "$EXPECTED_ARCH"
      - name: Verify tunnel isolation with disposable local VPN fixtures
        run: scripts/network-test.sh ha-downloads:smoke
      - name: Retain disposable fixture diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-failure-${{ matrix.arch }}
          path: work/network-*.log
          if-no-files-found: ignore
          retention-days: 1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested native image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          tag="$IMAGE:build-$GITHUB_SHA-$ARCH"
          docker tag ha-downloads:smoke "$tag"
          docker push "$tag"
          digest=$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$digest" > "$RUNNER_TEMP/digests/$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  publish:
    name: Publish both tested architectures
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge exact tested digests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -s "$RUNNER_TEMP/digests/amd64"
          test -s "$RUNNER_TEMP/digests/arm64"
          docker buildx imagetools create --tag "$IMAGE:${RELEASE_TAG#v}" \
            "$(cat "$RUNNER_TEMP/digests/amd64")" "$(cat "$RUNNER_TEMP/digests/arm64")"
          docker buildx imagetools inspect "$IMAGE:${RELEASE_TAG#v}" --raw |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
