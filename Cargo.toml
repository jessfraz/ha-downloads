[package]
name = "ha-downloads"
version = "0.4.7"
edition = "2024"
license = "MIT"
description = "VPN-protected Usenet downloads for Home Assistant"
repository = "https://github.com/jessfraz/ha-downloads"
default-run = "downloads"

[[bin]]
name = "downloads"
path = "src/main.rs"

[[bin]]
name = "ha-downloads"
path = "src/bin/ha-downloads.rs"

[dependencies]
ha-app-ui = { git = "https://github.com/jessfraz/ha-app-kit", tag = "v0.1.5" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dropshot = "0.18"
http = "1"
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
slog = "2"
subtle = "2"
thiserror = "2"
url = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "process", "fs", "io-util"] }
zeroize = "1"

[dev-dependencies]
ha-app-kit-ha = { git = "https://github.com/jessfraz/ha-app-kit", tag = "v0.1.5" }
tempfile = "3"
