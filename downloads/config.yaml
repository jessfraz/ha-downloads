name: Downloads
version: "0.3.1"
slug: downloads
description: Movies and TV with saved Radarr/Sonarr settings and VPN-protected downloads
url: https://github.com/jessfraz/ha-downloads
arch: [amd64, aarch64]
image: ghcr.io/jessfraz/ha-downloads
startup: application
boot: auto
stage: experimental
init: false
timeout: 30
backup: cold
ingress: true
ingress_port: 8099
ingress_stream: true
panel_admin: false
panel_icon: mdi:download-network-outline
privileged: [NET_ADMIN, NET_RAW]
devices:
  - /dev/net/tun
map:
  - type: media
    read_only: false
ports:
  8080/tcp: null
  8888/tcp: null
ports_description:
  8080/tcp: Optional authenticated API; no host port by default
  8888/tcp: Optional internal CONNECT proxy; no host port by default
options:
  vpn:
    provider: ""
    protocol: openvpn
    username: ""
    password: ""
    wireguard_private_key: ""
    wireguard_addresses: ""
    countries: ""
  network:
    local_subnets: ["172.30.32.0/23"]
  api_token: ""
  media:
    radarr: {url: "", api_key: ""}
    sonarr: {url: "", api_key: ""}
    prowlarr: {url: "", api_key: ""}
    plex: {url: "", api_key: ""}
    request_token: ""
    admin_token: ""
    integration_token: ""
    requester_user_ids: []
schema:
  vpn:
    provider: str
    protocol: list(openvpn|wireguard)
    username: str
    password: password
    wireguard_private_key: password
    wireguard_addresses: str
    countries: str
  network:
    local_subnets:
      - str
  api_token: password
  media:
    radarr: {url: str, api_key: password}
    sonarr: {url: str, api_key: password}
    prowlarr: {url: str, api_key: password}
    plex: {url: str, api_key: password}
    request_token: password
    admin_token: password
    integration_token: password
    requester_user_ids: [str]
discovery:
  - downloads
