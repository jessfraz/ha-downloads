[project]
name = "downloads-home-assistant"
version = "0.1.7"
description = "Read-only Home Assistant adapter tests for Downloads"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "gazetteer-matcher==1.1.0",
  "hassil==3.12.1",
  "home-assistant-intents==2026.10.6",
  "pytest-homeassistant-custom-component==0.13.375",
  "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["../tests_ha"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "ANN"]
