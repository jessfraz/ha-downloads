[project]
name = "downloads-home-assistant"
version = "0.4.9"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "pytest-homeassistant==2026.11.0",
  "aiohasupervisor==0.8.1",
  "ruff==0.17.3",
  # Core conversation requirements, used by real Assist tool calls.
  "gazetteer-matcher==1.1.0",
  "hassil==3.12.1",
  "home-assistant-intents==2026.10.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["../tests_ha"]
# Core initializes httpx2 before its native HTTP mocks; the standalone plugin does not.
addopts = "--strict-markers -p no:respx"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "ANN"]
