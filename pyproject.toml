[project]
name = "ha-downloads-runtime"
version = "0.1.0"
description = "Locked SABnzbd 5.1.3 runtime dependencies for Downloads"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "apprise==1.12.0",
  "sabctools==9.6.3",
  "CT3==3.4.0.post5",
  "cffi==2.1.0",
  "pycparser==3.0",
  "feedparser==6.0.12",
  "configobj==5.0.9",
  "cheroot==11.1.2",
  "six==1.17.0",
  "cherrypy==18.10.0",
  "jaraco.functools==4.6.0",
  "jaraco.collections==5.0.0",
  "jaraco.text==3.8.1",
  "jaraco.classes==3.4.0",
  "jaraco.context==4.3.0",
  "more-itertools==11.1.0",
  "zc.lockfile==4.0",
  "python-dateutil==2.9.0.post0",
  "tempora==5.8.1",
  "pytz==2026.2",
  "sgmllib3k==1.0.0",
  "portend==3.2.1",
  "PySocks==1.7.1",
  "puremagic==2.2.0",
  "rarfile==4.3",
  "guessit==4.1.0",
  "babelfish==0.6.1",
  "rebulk==6.0.1",
  "hachoir==3.3.0",
  "cryptography>=3.0",
  "ujson==5.13.0",
  "orjson==3.11.9",
  "notify2==0.3.1; sys_platform == 'linux'",
  "requests==2.34.2",
  "requests-oauthlib==2.0.0",
  "PyYAML==6.0.3",
  "markdown==3.10.2",
  "paho-mqtt==2.1.0",
  "charset-normalizer==3.4.9",
  "idna==3.18",
  "urllib3==2.7.0",
  "certifi==2026.10.18",
  "oauthlib==3.3.1",
  "PyJWT==2.13.0",
  "blinker==1.9.0",
]

[dependency-groups]
dev = ["ruff==0.17.0", "PyYAML==6.0.3"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
