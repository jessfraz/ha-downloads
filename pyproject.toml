[project]
name = "ha-downloads-runtime"
version = "0.4.4"
description = "Locked SABnzbd 5.1.3 runtime dependencies for Downloads"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "apprise==2.1.0",
  "sabctools==9.6.3",
  "ct3==3.4.0.post5",
  "cffi==2.1.1",
  "pycparser==3.12",
  "feedparser==6.0.14",
  "configobj==5.0.9",
  "cheroot==11.1.2",
  "six==1.17.0",
  "cherrypy==18.10.0",
  "jaraco.functools==4.6.0",
  "jaraco.collections==5.2.1",
  "jaraco.text==4.3.0",
  "jaraco.classes==3.4.0",
  "jaraco.context==6.1.2",
  "more-itertools==11.2.1",
  "zc.lockfile==4.1",
  "python-dateutil==4.0.0",
  "tempora==5.13.0",
  "pytz==2026.6",
  "sgmllib3k==1.0.0",
  "portend==3.2.1",
  "pysocks==1.7.1",
  "puremagic==2.2.0",
  "rarfile==4.5",
  "guessit==4.4.0",
  "babelfish==0.6.1",
  "rebulk==6.0.1",
  "hachoir==3.4.0",
  "cryptography>=3.0",
  "ujson==6.1.0",
  "orjson==3.13.0",
  "notify2==0.3.1; sys_platform == 'linux'",
  "requests==2.34.2",
  "requests-oauthlib==2.0.0",
  "pyyaml==6.0.3",
  "markdown==3.11.3",
  "paho-mqtt==2.2.0",
  "charset-normalizer==3.5.2",
  "idna==3.20",
  "urllib3==2.8.0",
  "certifi==2026.10.23",
  "oauthlib==4.0.1",
  "pyjwt==2.15.1",
  "blinker==1.9.0",
]

[dependency-groups]
dev = ["ruff==0.17.4", "pyyaml==6.0.3"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
